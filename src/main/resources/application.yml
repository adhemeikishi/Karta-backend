server:
  port: ${SERVER_PORT:8080}
  # Ne jamais exposer les stack traces / détails d'erreur au client (surtout en prod).
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

spring:
  application:
    name: qr-menu-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/qrmenu}
    username: ${DB_USER:qrmenu}
    password: ${DB_PASSWORD:qrmenu}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      # Le PDF de menu est limité à 10 Mo par MediaService (message d'erreur propre).
      # Ces limites Spring sont volontairement plus larges : elles ne servent que de
      # garde-fou contre un upload aberrant.
      max-file-size: 15MB
      max-request-size: 20MB

management:
  endpoints:
    web:
      exposure:
        # Seul /actuator/health est utile publiquement (healthcheck Docker/monitoring).
        # /info est désactivé par défaut faute de contenu utile - pas de fuite superflue.
        include: health
  endpoint:
    health:
      show-details: never

# Configuration spécifique au produit QR Menu.
# base-url = domaine utilisé DANS le QR (ne jamais hardcoder ça dans le code Java).
# AUCUNE valeur par défaut ici volontairement : un QR généré avec un mauvais domaine
# (ex: localhost oublié en prod) est un bug silencieux et coûteux - le démarrage doit
# échouer explicitement plutôt que produire des QR inutilisables. Le profil dev fournit
# son propre défaut pratique (voir application-dev.yml).
qr:
  base-url: ${QR_BASE_URL}
  # Chemin exposé publiquement pour la redirection, ex: /q/{code}
  redirect-path: /q
  image:
    default-png-size: 1000

# Auth minimale pour la V1 (basic auth sur /api/admin/**).
# AUCUNE valeur par défaut ici volontairement : si ADMIN_USERNAME/ADMIN_PASSWORD
# ne sont pas définis, le démarrage échoue plutôt que de tourner avec un mot de
# passe faible/connu par défaut. Les profils dev/test fournissent leurs propres
# valeurs de développement (voir application-dev.yml / application-test.yml).
admin:
  username: ${ADMIN_USERNAME}
  password: ${ADMIN_PASSWORD}

# KartaAI : extraction d'une carte PDF vers un menu structuré.
# La CLÉ N'A AUCUNE VALEUR PAR DÉFAUT et ne doit jamais figurer dans le code ni dans Git.
# Absente = KartaAI simplement désactivé (le reste du produit fonctionne) ; c'est un
# service optionnel, il ne doit pas empêcher le démarrage.
# Le MODÈLE est configurable (KARTA_AI_MODEL) : il évolue plus vite que le code.
kartaai:
  api-key: ${KARTA_AI_API_KEY:}
  model: ${KARTA_AI_MODEL:claude-opus-5}
  base-url: ${KARTA_AI_BASE_URL:https://api.anthropic.com}
  # Analyser une carte prend des dizaines de secondes ; borné pour ne pas immobiliser
  # un thread indéfiniment.
  timeout-seconds: ${KARTA_AI_TIMEOUT_SECONDS:120}
  max-tokens: ${KARTA_AI_MAX_TOKENS:16000}

# Stockage des fichiers uploadés (PDF de menu). JAMAIS en base de données.
# AUCUNE valeur par défaut ici volontairement : à fournir via l'environnement
# (STORAGE_DIR). Les profils dev/test fournissent leur propre répertoire.
storage:
  dir: ${STORAGE_DIR}

