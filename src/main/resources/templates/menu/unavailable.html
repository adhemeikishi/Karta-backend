<!DOCTYPE html>
<!--/*
  Menu indisponible. Servie avec un 404 pour tous les cas non diffusables :
  code inconnu, QR désactivé, menu absent, brouillon ou non publié.
  Volontairement identique dans tous les cas — le visiteur n'a pas à savoir
  lequel s'applique, et un brouillon ne doit rien laisser deviner.
*/-->
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:," />
    <title>Menu indisponible</title>
    <th:block th:replace="~{menu/base :: tokens}"></th:block>
    <style>
      .panel {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem 1.5rem;
      }
      .panel-tick {
        width: 1.75rem;
        height: 3px;
        background-color: var(--k-persimmon);
        margin-bottom: 1.25rem;
      }
      .panel-title {
        font-size: 1.25rem;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      .panel-text {
        margin-top: 0.5rem;
        font-size: 0.9375rem;
        color: var(--k-ink-600);
        max-width: 22rem;
      }
      .panel-mark {
        margin-top: 2.5rem;
        font-size: 0.75rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-weight: 700;
        color: var(--k-ink-400);
      }
    </style>
  </head>

  <body>
    <div class="panel">
      <div class="panel-tick"></div>
      <h1 class="panel-title">Menu indisponible</h1>
      <p class="panel-text">
        Ce menu n'est pas accessible pour le moment. Rapprochez-vous du restaurant.
      </p>
      <p class="panel-mark">Karta</p>
    </div>
  </body>
</html>
