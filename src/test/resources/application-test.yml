spring:
  datasource:
    url: jdbc:h2:mem:qrmenu;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: sa

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration

qr:
  base-url: http://localhost:8080

# Répertoire de stockage isolé pour les tests (temp système).
storage:
  dir: ${java.io.tmpdir}/karta-storage-test

admin:
  username: admin
  password: test-password

# KartaAI : aucune clé en test. Les tests utilisent un extracteur déterministe
# (FakeMenuExtractor) et n'appellent JAMAIS d'API externe — donc aucun coût, aucun réseau.
kartaai:
  api-key: ""
