services:
  postgres:
    image: postgres:16-alpine
    container_name: qrmenu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: qrmenu
      POSTGRES_USER: qrmenu
      POSTGRES_PASSWORD: qrmenu
    ports:
      - "5432:5432"
    volumes:
      - qrmenu-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrmenu -d qrmenu"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qrmenu-postgres-data:
